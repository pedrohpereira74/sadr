name: sadr doctor

on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # Detect drift on every PR push and post/refresh the ChatOps comment. A
  # non-zero exit fails this check; make it a required check in branch protection
  # so unresolved drift blocks the merge.
  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -o "$RUNNER_TEMP/sadr" .
      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"
      - name: Run doctor
        id: doctor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          "$RUNNER_TEMP/sadr" doctor --ci --base "origin/${{ github.base_ref }}" >doctor-out.txt
          echo "exit=$?" >>"$GITHUB_OUTPUT"
      - name: Upsert PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('doctor-out.txt', 'utf8').trim(); } catch (e) { return; }
            const marker = '<!-- sadr-doctor -->';
            if (!body.includes(marker)) return;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Gate
        if: steps.doctor.outputs.exit != '0'
        run: |
          echo "sadr doctor: unresolved drift blocks the merge"
          exit 1

  # Apply approved rewrites when an authorized reviewer comments
  # "/doctor apply <ids|all>". author_association is checked here (first gate)
  # and again inside the binary (defense in depth).
  apply:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/doctor apply') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and command
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number,
            });
            core.setOutput('head', pr.data.head.ref);
            core.setOutput('base', pr.data.base.ref);
            const line = context.payload.comment.body.split('\n').find(l => l.trim().startsWith('/doctor apply'));
            core.setOutput('ids', line.trim().replace('/doctor apply', '').trim());
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build -o "$RUNNER_TEMP/sadr" .
      - name: Configure git author
        run: |
          git config user.name "sadr-doctor[bot]"
          git config user.email "sadr-doctor@users.noreply.github.com"
      - name: Fetch base branch
        run: git fetch origin "${{ steps.pr.outputs.base }}"
      - name: Apply approved rewrites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          "$RUNNER_TEMP/sadr" doctor --ci \
            --base "origin/${{ steps.pr.outputs.base }}" \
            --apply "${{ steps.pr.outputs.ids }}"
      - name: Push changes
        run: git push origin "HEAD:${{ steps.pr.outputs.head }}"
