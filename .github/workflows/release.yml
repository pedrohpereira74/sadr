name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o sadr-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o sadr-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o sadr-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o sadr-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o sadr-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sadr-linux-amd64
            sadr-linux-arm64
            sadr-darwin-amd64
            sadr-darwin-arm64
            sadr-windows-amd64.exe