# sadr doctor — GitLab CI gatekeeper.
#
# Mirrors .github/workflows/doctor.yml for GitLab. Requires CI/CD variables:
#   GITLAB_TOKEN     - project/personal access token (api scope) to post MR
#                      notes and push rewrites back to the source branch.
#   GEMINI_API_KEY   - (or ANTHROPIC_API_KEY/OPENAI_API_KEY/DEEPSEEK_API_KEY,
#                      matching ai.provider) for drift detection/rewrite.
#
# Make "Pipelines must succeed" required in the project's merge settings so
# unresolved drift (a failed detect job) blocks the merge.

stages:
  - doctor

# Detect drift on every merge request. A non-zero exit fails the job.
doctor:detect:
  stage: doctor
  image: golang:1.26
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0" # full history so origin/<base>...HEAD has a merge base
  script:
    - go build -o /usr/local/bin/sadr .
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      set +e
      sadr doctor --ci --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >doctor-out.txt
      code=$?
      cat doctor-out.txt
      if [ -n "$GITLAB_TOKEN" ] && grep -q 'sadr-doctor' doctor-out.txt; then
        curl --silent --fail --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data-urlencode "body@doctor-out.txt" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" >/dev/null
      fi
      exit $code

# Apply approved rewrites. Manual: only project members with at least Developer
# access can trigger it (GitLab's native gate). Set APPLY_IDS when running it
# (comma-separated drift ids, or "all").
doctor:apply:
  stage: doctor
  image: golang:1.26
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  variables:
    GIT_DEPTH: "0"
    APPLY_IDS: "all"
  script:
    - go build -o /usr/local/bin/sadr .
    - git config user.name "sadr-doctor"
    - git config user.email "sadr-doctor@users.noreply.gitlab.com"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - git checkout -B "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - sadr doctor --ci --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --apply "$APPLY_IDS"
    - git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
