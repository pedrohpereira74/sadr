version: 2

project_name: sadr
before:
  hooks:
    - go mod tidy

builds:
  - id: sadr
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/pedrohpereira74/sadr/cmd.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch look clean
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - file_name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    vendor: "pedrohpereira74"
    homepage: "https://github.com/pedrohpereira74/sadr"
    maintainer: "Pedro"
    description: "Capture code with context. Because snippets without a 'why' are sadr."
    license: "Apache-2.0"
    formats:
      - deb
      - rpm

brews:
  - repository:
      owner: pedrohpereira74
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/pedrohpereira74/sadr"
    description: "Capture code with context. Because snippets without a 'why' are sadr."
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

scoops:
  - repository:
      owner: pedrohpereira74
      name: scoop-bucket
    homepage: "https://github.com/pedrohpereira74/sadr"
    description: "Capture code with context. Because snippets without a 'why' are sadr."
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

release:
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
